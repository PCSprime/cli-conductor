name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes: { label: What happened?, description: What did you do, what did you expect, what happened instead? }
    validations: { required: true }
  - type: input
    id: env
    attributes: { label: Environment, placeholder: "Windows 11 23H2, Node 24.1, CLI Conductor 0.1.0" }
    validations: { required: true }
  - type: input
    id: cli
    attributes: { label: CLI(s) involved and versions, placeholder: "codex 0.x, claude 2.x" }
  - type: textarea
    id: events
    attributes: { label: Relevant events.jsonl lines / screenshots, description: "From <workspace>\\.tmp\\cli_conductor\\events.jsonl. Remove anything private.", render: text }
