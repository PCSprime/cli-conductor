name: Feature request
description: Suggest an idea or a new CLI to support
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes: { label: Problem, description: What are you trying to do? }
    validations: { required: true }
  - type: textarea
    id: idea
    attributes: { label: Proposed solution }
  - type: textarea
    id: links
    attributes: { label: Docs / links, description: "For new CLIs or flags: link the official docs or paste --help output." }
