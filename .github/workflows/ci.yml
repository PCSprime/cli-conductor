name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: unit
        run: node --test test/unit.test.js
      - name: ui
        run: node --test test/ui.test.js
      - name: accounts
        run: node --test test/accounts.test.js
      # PTY-heavy steps use TAP: on a native crash it records exitCode (e.g. 3221225477 = 0xC0000005),
      # which the spec reporter hides behind a bare 'test failed'.
      - name: restart
        run: node --test --test-reporter=tap test/restart.test.js
      - name: send-script
        run: node --test --test-reporter=tap test/send-script.test.js
      - name: integration
        run: node --test --test-reporter=tap test/integration.test.js
        timeout-minutes: 5
